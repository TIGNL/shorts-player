<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts Player</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; }
#player { width:100%; height:100%; }
#overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:998; }
#info {
  position:fixed; bottom:20px; left:0; right:0;
  text-align:center; color:rgba(255,255,255,0.5);
  font-size:12px; z-index:999; pointer-events:none;
}
#back {
  position:fixed; top:12px; left:12px; z-index:999;
  background:rgba(0,0,0,0.6); color:#fff; border:none;
  border-radius:50%; width:40px; height:40px; font-size:22px; cursor:pointer;
}
</style>
</head>
<body>
<button id="back" onclick="window.location.href='https://m.youtube.com/feed/playlists'">‹</button>
<div id="player"></div>
<div id="overlay"></div>
<div id="info"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var ids = ["dQw4w9WgXcQ", "jNQXAC9IVRw", "9bZkp7q19f0"];
var idx = 0;
var player;
var touchStartY = 0;

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    videoId: ids[0],
    playerVars: { autoplay:1, playsinline:1, controls:1, rel:0 },
    events: { onReady: function(e){ e.target.playVideo(); updateInfo(); } }
  });
}

function updateInfo() {
  document.getElementById("info").textContent = (idx+1) + " / " + ids.length;
}

function next() {
  if (idx < ids.length-1) { idx++; player.loadVideoById(ids[idx]); updateInfo(); }
}
function prev() {
  if (idx > 0) { idx--; player.loadVideoById(ids[idx]); updateInfo(); }
}

var overlay = document.getElementById("overlay");
overlay.addEventListener("touchstart", function(e){
  touchStartY = e.touches[0].clientY;
}, {passive:true});

overlay.addEventListener("touchend", function(e){
  var dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) < 50) return;
  if (dy > 0) next(); else prev();
}, {passive:true});
</script>
</body>
</html>
