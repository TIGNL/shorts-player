<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; padding: 20px; font-size: 14px; }
#log { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="log">بدء التشخيص...\n</div>
<script>
var CACHE_KEY = "ytmv_cache_v1";

function log(msg) {
  document.getElementById("log").textContent += msg + "\n";
}

// خطوة ١: هل الكاش موجود؟
var cached = null;
try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e) {}
log("الكاش: " + (cached ? cached.length + " فيديو" : "غير موجود"));

// خطوة ٢: هل يمكن الوصول لـ m.youtube.com؟
log("جارٍ الاتصال بـ m.youtube.com...");
var x = new XMLHttpRequest();
x.open("GET", "https://m.youtube.com/feed/playlists", true);
x.onload = function(){ log("نجح الاتصال - الحالة: " + x.status + " - الحجم: " + x.responseText.length + " حرف"); };
x.onerror = function(){ log("فشل الاتصال - CORS مانع"); };
x.send();
</script>
</body>
</html>
