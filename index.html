<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }

#container {
  width: 100%;
  height: 100%;
  position: relative;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  position: absolute;
  top: 0; left: 0;
}

#back {
  position: fixed;
  top: env(safe-area-inset-top, 12px);
  left: 12px;
  z-index: 999;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#info {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 20px);
  left: 0; right: 0;
  text-align: center;
  color: rgba(255,255,255,0.5);
  font-size: 12px;
  z-index: 999;
  pointer-events: none;
}

#loading {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 16px;
  z-index: 1000;
}
</style>
</head>
<body>

<div id="loading">جارٍ التحميل...</div>
<button id="back" onclick="goBack()">‹</button>
<div id="container"></div>
<div id="info"></div>

<script>
var CACHE_KEY = "ytmv_cache_v1";
var MAX_PAGES = 100;
var videos = [];
var idx = 0;
var touchStartY = 0;

/* ── helpers ── */
function isArr(o) { return Object.prototype.toString.call(o) === "[object Array]"; }

function getText(t) {
  if (!t) return "";
  if (t.simpleText) return t.simpleText;
  if (typeof t.content === "string") return t.content;
  if (t.runs) return t.runs.map(function(r){ return r.text||""; }).join("");
  return "";
}

function findIn(o, check) {
  if (!o || typeof o !== "object") return null;
  var r = check(o); if (r) return r;
  if (isArr(o)) { for (var i=0;i<o.length;i++){var x=findIn(o[i],check);if(x)return x;} return null; }
  for (var k in o) { if (o.hasOwnProperty(k)){var x2=findIn(o[k],check);if(x2)return x2;} }
  return null;
}

function findToken(o) {
  return findIn(o, function(x){
    return (x.continuationCommand && typeof x.continuationCommand.token === "string") ? x.continuationCommand.token : null;
  });
}

function walker(o, out, seen, type) {
  if (!o || typeof o !== "object") return;
  if (isArr(o)) { for (var i=0;i<o.length;i++) walker(o[i],out,seen,type); return; }
  if (type === "playlists") {
    if (typeof o.contentId === "string" && o.contentId.length > 11 &&
        o.contentId.indexOf("PL") === 0 && !seen[o.contentId]) {
      var priv = findIn(o, function(x){ return typeof x.privacy==="string" ? x.privacy.toUpperCase() : null; });
      if (priv !== "PRIVATE") { seen[o.contentId]=1; out.push(o.contentId); }
    }
  } else {
    var id=null, title="";
    if (typeof o.contentId==="string" && o.contentId.length===11 && (o.contentImage||o.metadata)) {
      id=o.contentId;
      var md=o.metadata&&o.metadata.lockupMetadataViewModel;
      title=md?getText(md.title):"";
    } else if (typeof o.videoId==="string" && o.videoId.length===11) {
      var t0=getText(o.title)||getText(o.headline);
      if (t0){id=o.videoId;title=t0;}
    }
    if (id&&!seen[id]){seen[id]=1;out.push({id:id,title:title||"Video"});}
  }
  for (var k in o){if(o.hasOwnProperty(k))walker(o[k],out,seen,type);}
}

function parsePlain(html, start) {
  var depth=0,inStr=false,esc=false;
  for (var i=start;i<html.length;i++){
    var c=html.charAt(i);
    if(inStr){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inStr=false;}
    else{if(c==='"')inStr=true;else if(c==="{")depth++;else if(c==="}"){depth--;if(depth===0){try{return JSON.parse(html.substring(start,i+1));}catch(e){return null;}}}}
  }
  return null;
}

function parseEscaped(html, q) {
  var i=q+1,end=-1;
  while(i<html.length){var c=html.charAt(i);if(c==="\\"){i+=2;continue;}if(c==="'"){end=i;break;}i++;}
  if(end===-1)return null;
  var raw=html.substring(q+1,end).replace(/\\x([0-9a-fA-F]{2})/g,"\\u00$1");
  try{return JSON.parse(JSON.parse('"'+raw.replace(/\\'/g,"'")+'"'));}catch(e){return null;}
}

function extractData(html) {
  var idx=html.indexOf("ytInitialData"); if(idx===-1)return null;
  var q=html.indexOf("'",idx),b=html.indexOf("{",idx);
  if(q!==-1&&q-idx<40&&(b===-1||q<b))return parseEscaped(html,q);
  if(b!==-1)return parsePlain(html,b);
  return null;
}

function grab(html,name,chars){
  var m=new RegExp(name+"(?:\\\\x22|[\"'])\\s*:\\s*(?:\\\\x22|[\"'])(["+chars+"]+)").exec(html);
  return m?m[1]:null;
}

function xhrGet(url, cb) {
  var x=new XMLHttpRequest();
  x.open("GET",url,true);
  x.onload=function(){cb(x.status,x.responseText);};
  x.onerror=function(){cb(0,"");};
  x.send();
}

function fetchPlaylist(id, cb) {
  var out=[],seen={},pages=0,apiKey=null,ver="2.20261116.00.00";
  function post(token) {
    if(!token||pages>=MAX_PAGES){cb(out);return;}
    pages++;
    var x=new XMLHttpRequest();
    x.open("POST","https://m.youtube.com/youtubei/v1/browse?key="+apiKey,true);
    var hdrs=[["Content-Type","application/json"],["X-Youtube-Client-Name","2"],["X-Youtube-Client-Version",ver]];
    for(var i=0;i<hdrs.length;i++) x.setRequestHeader(hdrs[i][0],hdrs[i][1]);
    x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){}if(!j){cb(out);return;}walker(j,out,seen,"videos");post(findToken(j));};
    x.onerror=function(){cb(out);};
    x.send(JSON.stringify({context:{client:{clientName:"MWEB",clientVersion:ver,hl:"en"}},continuation:token}));
  }
  xhrGet("https://m.youtube.com/playlist?list="+id, function(status,html){
    if(status!==200){cb(out);return;}
    var data=extractData(html);
    if(data)walker(data,out,seen,"videos");
    apiKey=grab(html,"INNERTUBE_API_KEY","A-Za-z0-9_\\-");
    ver=grab(html,"INNERTUBE_CONTEXT_CLIENT_VERSION","0-9.")||ver;
    var token=data?findToken(data):null;
    if(token&&apiKey)post(token);else cb(out);
  });
}

function getPlaylists(html) {
  var data = extractData(html);
  if (!data) return [];
  var pids=[],seen={};
  walker(data,pids,seen,"playlists");
  return pids;
}

function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}

/* ── player ── */
function showVideo(i) {
  var v = videos[i];
  if (!v) return;
  var container = document.getElementById("container");
  container.innerHTML = "";
  var iframe = document.createElement("iframe");
  iframe.src = "https://www.youtube.com/embed/" + v.id + "?autoplay=1&playsinline=1";
  iframe.setAttribute("allowfullscreen","");
  iframe.setAttribute("allow","autoplay");
  container.appendChild(iframe);
  document.getElementById("info").textContent = (i+1) + " / " + videos.length;
  document.getElementById("loading").style.display = "none";
}

function next() { if (idx < videos.length-1) { idx++; showVideo(idx); } }
function prev() { if (idx > 0) { idx--; showVideo(idx); } }
function goBack() { window.location.href = "https://m.youtube.com/feed/playlists"; }

/* ── swipe ── */
document.addEventListener("touchstart", function(e){
  touchStartY = e.touches[0].clientY;
}, {passive:true});

document.addEventListener("touchend", function(e){
  var dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) < 50) return;
  if (dy > 0) next(); else prev();
}, {passive:true});

/* ── init ── */
function init() {
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e) {}

  if (cached && cached.length) {
    videos = shuffle(cached);
    idx = 0;
    showVideo(idx);
  }

  xhrGet("https://m.youtube.com/feed/playlists", function(status, html){
    if (status !== 200) return;
    var pids = getPlaylists(html);
    if (!pids.length) return;
    var all=[], seen={}, n=0;
    function next2(){
      if(n>=pids.length){
        if(!all.length)return;
        try{localStorage.setItem(CACHE_KEY,JSON.stringify(all));}catch(e){}
        if(!cached||!cached.length){ videos=shuffle(all); idx=0; showVideo(idx); }
        return;
      }
      fetchPlaylist(pids[n++],function(vids){
        for(var i=0;i<vids.length;i++)if(!seen[vids[i].id]){seen[vids[i].id]=1;all.push(vids[i]);}
        next2();
      });
    }
    next2();
  });
}

init();
</script>
</body>
</html>
