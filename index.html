<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Player Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; width: 100%; height: 100vh; overflow: hidden; }
iframe { width: 100%; height: 100%; border: none; display: block; }
#msg { color: #fff; padding: 20px; font-size: 16px; text-align: center; padding-top: 40vh; }
</style>
</head>
<body>
<div id="msg">جارٍ التحميل...</div>
<script>
var TEST_ID = "dQw4w9WgXcQ";
var hash = location.hash.replace("#","");
var id = hash.length === 11 ? hash : TEST_ID;
var iframe = document.createElement("iframe");
iframe.src = "https://www.youtube.com/embed/" + id + "?autoplay=1&playsinline=1";
iframe.setAttribute("allowfullscreen","");
iframe.setAttribute("allow","autoplay");
iframe.style.cssText = "width:100%;height:100vh;border:none;display:block;";
iframe.onload = function(){ document.getElementById("msg").style.display="none"; };
document.body.appendChild(iframe);
</script>
</body>
</html>
